name: Deploy prod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Tests first, in the same job: steps are sequential and abort on failure,
      # so a red test cannot reach the deploy steps below.
      - run: npm run typecheck
      - run: npm test

      - name: Apply D1 migrations (prod)
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy (prod)
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          curl -fsS https://eshop.brazdil94.workers.dev/api/products \
            | grep -q '"slug"'
