name: Deploy dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Tests first, in the same job: steps are sequential and abort on failure,
      # so a red test cannot reach the deploy steps below.
      - run: npm run typecheck
      - run: npm test

      # Every wrangler command below MUST carry `--env dev`. Dropping it silently
      # retargets production. tests/node/workflows.test.ts asserts that, and
      # `npm test` above is what enforces it.
      - name: Apply D1 migrations (dev)
        run: npx wrangler d1 migrations apply DB --env dev --remote

      - name: Deploy (dev)
        run: npx wrangler deploy --env dev

      - name: Smoke test
        run: |
          curl -fsS https://eshop-dev.brazdil94.workers.dev/api/products \
            | grep -q '"slug"'
